<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso tempo marcado 🗓️</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="starCanvas"></canvas>

    <h1>🗓️ Nosso tempo marcado</h1>

    <div class="stats-container">
        <div class="stat-card">
            <span id="stat-horas">0</span>
            <p>Horas de amor</p>
        </div>
        <div class="stat-card">
            <span id="stat-beijos">0</span>
            <p>Beijos estimados</p>
        </div>
    </div>

    <div id="todos-os-calendarios"></div>

    <div class="contador-preciso">
        <p>estamos juntos há exatos:</p>
        <div class="relogio-digital">
            <span id="live-dias">00</span>d 
            <span id="live-horas">00</span>h 
            <span id="live-min">00</span>m 
            <span id="live-seg">00</span>s
        </div>
    </div>

    <a class="voltar" href="index.html">← voltar</a>

    <script src="js/estrelas.js"></script>
    <script src="js/calendario.js"></script>
</body>
</html>
